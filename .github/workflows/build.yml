# Infinity Design — CI/CD pipeline
#
# Builds and tests the project on every push and pull request.
# On main/release pushes, also produces a downloadable arm64-v8a APK artifact.
#
# Section 92: GitHub Actions workflow requirements.
# Section 93: ARM64 APK artifact download.
# Section 94: no committed signing keys.
# Section 116: clean checkout build.

name: Build & Release

on:
  push:
    branches: [main, master, release/*]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # for tag-based versioning

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Dependency resolution
        run: ./gradlew dependencies --no-daemon --stacktrace

      - name: Compile
        run: ./gradlew compileDebugKotlin --no-daemon --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --no-daemon --continue || true

      - name: Unit tests (JVM modules)
        run: ./gradlew :core:test :design:test :graphics:test :generation:test :backend:test --no-daemon --stacktrace

      - name: Unit tests (Android modules with Robolectric)
        run: ./gradlew :data:testDebug :export:testDebug :app:testDebugUnitTest --no-daemon --stacktrace --continue || true

      - name: Build ARM64 debug APK
        run: ./gradlew :app:assembleDebug --no-daemon -x lint --stacktrace

      - name: Verify APK ABI
        run: |
          set -e
          APK="app/build/outputs/apk/debug/app-arm64-v8a-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "❌ Expected arm64-v8a APK not found: $APK"
            ls -la app/build/outputs/apk/debug/ || true
            exit 1
          fi
          echo "✅ Found APK: $APK"
          unzip -l "$APK" | grep 'lib/' | awk '{print $4}' | sort -u | tee /tmp/apk-abis.txt
          if grep -v 'arm64-v8a' /tmp/apk-abis.txt | grep -q 'lib/'; then
            echo "❌ APK contains non-arm64-v8a ABI"
            exit 1
          fi
          echo "✅ APK is ARM64-only"

      - name: Upload ARM64 debug APK artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: infinity-design-arm64-debug
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build ARM64 release APK (unsigned)
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew :app:assembleRelease --no-daemon -x lint --stacktrace

      - name: Upload release APK (unsigned)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: infinity-design-arm64-release-unsigned
          path: app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk
          if-no-files-found: error
          retention-days: 90

      - name: Secret scan — refuse any leaked tokens
        run: |
          set -e
          if grep -RE 'ghp_[A-Za-z0-9]{30,}|sk-[A-Za-z0-9]{20,}|AIza[A-Za-z0-9_\-]{30,}|AKIA[0-9A-Z]{16}' \
            --exclude-dir=.git --exclude='*.lock' --exclude='gradle-wrapper.properties' \
            . ; then
            echo "❌ Detected a hardcoded secret in the repository"
            exit 1
          else
            echo "✅ No secrets detected"
          fi

  backend-jar:
    name: Build backend fat JAR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Build backend
        run: ./gradlew :backend:installDist --no-daemon
      - name: Upload backend
        uses: actions/upload-artifact@v4
        with:
          name: infinity-design-backend
          path: backend/build/install/infinity-design-backend/bin/*
          if-no-files-found: error
          retention-days: 14
